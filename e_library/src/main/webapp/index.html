<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Realm - Tunisian E-Library</title>
  <link rel="icon" type="image/png" href="logo.jpg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Amiri:wght@700&display=swap');

    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #d4b896 0%, #c9a876 100%);
  min-height: 100vh;
  padding: 20px;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: 
    repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(139, 58, 58, 0.03) 35px, rgba(139, 58, 58, 0.03) 70px),
    repeating-linear-gradient(-45deg, transparent, transparent 35px, rgba(26, 123, 123, 0.03) 35px, rgba(26, 123, 123, 0.03) 70px);
  pointer-events: none;
  z-index: 0;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

header {
  text-align: center;
  margin-bottom: 40px;
  animation: fadeIn 2s ease-in;
  position: relative;
}



@keyframes floatFlag {
  0%, 100% {
    transform: translateX(-50%) translateY(0px);
  }
  25% {
    transform: translateX(-50%) translateY(-12px);
  }
  50% {
    transform: translateX(-50%) translateY(0px);
  }
  75% {
    transform: translateX(-50%) translateY(-12px);
  }
}

@keyframes waveFlag {
  0%, 100% {
    transform: perspective(1200px) rotateY(0deg) rotateX(0deg);
    filter: brightness(1);
  }
  15% {
    transform: perspective(1200px) rotateY(-8deg) rotateX(2deg);
    filter: brightness(1.1);
  }
  30% {
    transform: perspective(1200px) rotateY(-5deg) rotateX(-1deg);
    filter: brightness(0.95);
  }
  50% {
    transform: perspective(1200px) rotateY(8deg) rotateX(2deg);
    filter: brightness(1.05);
  }
  65% {
    transform: perspective(1200px) rotateY(5deg) rotateX(-1deg);
    filter: brightness(0.95);
  }
  85% {
    transform: perspective(1200px) rotateY(-8deg) rotateX(1deg);
    filter: brightness(1.1);
  }
}

@keyframes ripple {
  0%, 100% {
    clip-path: polygon(
      0% 0%, 
      100% 0%, 
      100% 100%, 
      0% 100%
    );
  }
  25% {
    clip-path: polygon(
      0% 2%, 
      100% 0%, 
      100% 98%, 
      0% 100%
    );
  }
  50% {
    clip-path: polygon(
      0% 0%, 
      100% 2%, 
      100% 100%, 
      0% 98%
    );
  }
  75% {
    clip-path: polygon(
      0% 1%, 
      100% 0%, 
      100% 99%, 
      0% 100%
    );
  }
}



.title {
  font-family: 'Playfair Display', serif;
  font-size: 3.5rem;
  color: white;
  text-shadow: 
    3px 3px 6px rgba(0, 0, 0, 0.6),
    0 0 30px rgba(255, 255, 255, 0.3);
  margin: 0 0 15px 0;
  letter-spacing: 3px;
  font-weight: 700;
}

.title-arabic {
  font-family: 'Amiri', serif;
  font-size: 2.8rem;
  color: rgba(255, 255, 255, 0.98);
  text-shadow: 
    2px 2px 5px rgba(0, 0, 0, 0.5),
    0 0 20px rgba(255, 255, 255, 0.2);
  margin: 0 0 15px 0;
  font-weight: 700;
  direction: rtl;
  letter-spacing: 2px;
}

.subtitle {
  font-size: 1.2rem;
  color: rgba(255, 255, 255, 0.95);
  font-weight: 600;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
  margin: 0;
  letter-spacing: 1px;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.filter-section {
  background: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 10px 30px rgba(139, 58, 58, 0.2);
  margin-bottom: 30px;
  animation: slideUp 0.8s ease-out;
  border: 3px solid #8b3a3a;
  position: relative;
}

.filter-section::before {
  content: '';
  color: white;
  position: absolute;
  top: -3px;
  left: -3px;
  right: -3px;
  bottom: -3px;
  background: linear-gradient(45deg, #8b3a3a, #1a7b7b, #8b3a3a);
  border-radius: 15px;
  z-index: -1;
  opacity: 0.3;
}

.filter-group {
  margin-bottom: 20px;
}

.filter-group label {
  display: block;
  font-weight: 600;
  color: #8b3a3a;
  margin-bottom: 8px;
  font-size: 1.1rem;
}

select {
  width: 100%;
  padding: 12px 15px;
  font-size: 1rem;
  border: 2px solid #d4b896;
  border-radius: 8px;
  background: white;
  cursor: pointer;
  transition: all 0.3s ease;
}

select:hover {
  border-color: #8b3a3a;
  box-shadow: 0 2px 8px rgba(139, 58, 58, 0.1);
}

select:focus {
  outline: none;
  border-color: #8b3a3a;
  box-shadow: 0 0 0 3px rgba(139, 58, 58, 0.1);
}

.books-section {
  animation: fadeIn 1s ease-in;
}

.books-header {
  color: #8b3a3a;
  margin-bottom: 20px;
  padding: 20px;
  background: rgba(255, 255, 255, 0.9);
  border-radius: 12px;
  box-shadow: 0 4px 12px rgba(139, 58, 58, 0.1);
  border-left: 5px solid #8b3a3a;
}

.books-header h2 {
  font-size: 1.8rem;
  margin-bottom: 5px;
  color: #8b3a3a;
}

.books-count {
  opacity: 0.9;
  font-size: 1.1rem;
  color: #1a7b7b;
  font-weight: 600;
}

.books-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 25px;
}

.book-card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(139, 58, 58, 0.15);
  transition: all 0.3s ease;
  cursor: pointer;
  animation: fadeInUp 0.5s ease-out;
  border: 3px solid #8b3a3a;
  position: relative;
  overflow: hidden;
}

.book-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 6px;
  height: 100%;
  background: linear-gradient(to bottom, #8b3a3a, #1a7b7b);
}

.book-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(139, 58, 58, 0.25);
  border-color: #1a7b7b;
}

.book-title {
  font-size: 1.3rem;
  font-weight: 700;
  color: #8b3a3a;
  margin-bottom: 15px;
  line-height: 1.4;
  border-bottom: 3px solid #1a7b7b;
  padding-bottom: 10px;
  padding-left: 10px;
}

.book-meta {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 15px;
  padding-left: 10px;
}

.book-meta-item {
  display: flex;
  align-items: center;
  font-size: 0.95rem;
  color: #5a5a5a;
}

.book-meta-item strong {
  color: #8b3a3a;
  min-width: 80px;
  font-weight: 600;
}

.book-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 15px;
  padding-left: 10px;
}

.tag {
  background: #8b3a3a;
  color: white;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 600;
  box-shadow: 0 2px 4px rgba(139, 58, 58, 0.3);
  transition: all 0.3s ease;
}

.tag:hover {
  background: #1a7b7b;
  transform: scale(1.05);
}

.book-actions {
  margin-top: 15px;
  padding-top: 15px;
  border-top: 2px solid #d4b896;
  display: flex;
  gap: 10px;
  padding-left: 10px;
}

.btn-download {
  flex: 1;
  padding: 12px 24px;
  background: #8b3a3a;
  color: white;
  border: 2px solid #8b3a3a;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 8px rgba(139, 58, 58, 0.3);
}

.btn-download:hover {
  background: #d4b896;
  color: #8b3a3a;
  border-color: #8b3a3a;
  transform: translateY(-2px);
  box-shadow: 0 6px 12px rgba(139, 58, 58, 0.4);
}

.btn-download:active {
  transform: translateY(0);
}

.btn-download:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.no-books {
  text-align: center;
  color: #8b3a3a;
  font-size: 1.3rem;
  padding: 60px 20px;
  background: rgba(255, 255, 255, 0.9);
  border-radius: 15px;
  backdrop-filter: blur(10px);
  border: 3px solid #8b3a3a;
  box-shadow: 0 8px 20px rgba(139, 58, 58, 0.2);
}

.loading {
  text-align: center;
  color: #8b3a3a;
  font-size: 1.5rem;
  padding: 60px 20px;
}

.spinner {
  border: 4px solid rgba(139, 58, 58, 0.2);
  border-top: 4px solid #8b3a3a;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  animation: spin 1s linear infinite;
  margin: 20px auto;
}

.debug-info {
  background: rgba(255,255,255,0.1);
  color: white;
  padding: 15px;
  border-radius: 8px;
  margin-top: 15px;
  font-size: 0.9rem;
  display: none;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 768px) {
  .books-grid {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>
<body>
  <div class="container">
    <header>
     
            <h1 class="title">Knowledge Realm</h1>
            <h2 class="title-arabic">مملكة المعرفة</h2>
            <p class="subtitle">Explore educational resources across all levels</p>
          
      </div>
    </header>

    <div class="filter-section">
      <div class="filter-group">
        <label for="educationCategory">Select Education Category:</label>
        <select id="educationCategory">
          <option value="">-- Select Category --</option>
          <option value="basic">Basic Education (Primary & Preparatory)</option>
          <option value="secondary">Secondary Education (Lycée)</option>
          <option value="higher">Higher Education (University)</option>
        </select>
      </div>

      <div class="filter-group" id="levelGroup" style="display: none;">
        <label for="educationLevel">Select Education Level:</label>
        <select id="educationLevel">
          <option value="">-- Select Level --</option>
        </select>
      </div>

      <div class="filter-group" id="gradeGroup" style="display: none;">
        <label for="gradeSelect">Select Grade/Year:</label>
        <select id="gradeSelect">
          <option value="">-- All Grades --</option>
        </select>
      </div>

      <div class="filter-group" id="specializationGroup" style="display: none;">
        <label for="specializationSelect">Select Specialization:</label>
        <select id="specializationSelect">
          <option value="">-- All Specializations --</option>
        </select>
      </div>

      <div class="filter-group" id="fieldGroup" style="display: none;">
        <label for="fieldSelect">Select Field:</label>
        <select id="fieldSelect">
          <option value="">-- All Fields --</option>
        </select>
      </div>

      <div class="debug-info" id="debugInfo"></div>
    </div>

    <div class="books-section" id="booksSection" style="display: none;">
      <div class="books-header">
        <h2 id="sectionTitle">Available Books</h2>
        <p class="books-count" id="booksCount">0 books found</p>
      </div>
      <div class="books-grid" id="booksGrid"></div>
    </div>
  </div>

  <script>
    const educationLevels = {
      basic: [
        { code: 'PRIMARY', name: 'Primary Education (Enseignement Primaire)' },
        { code: 'PREPARATORY', name: 'Preparatory Education (Enseignement Préparatoire)' }
      ],
      secondary: [
        { code: 'SECONDARY', name: 'Secondary Education (Enseignement Secondaire)' }
      ],
      higher: [
        { code: 'PREP_ENG', name: 'Preparatory Engineering School (Classes Préparatoires)' },
        { code: 'ENGINEERING', name: 'Engineering School (École d\'Ingénieurs)' },
        { code: 'LICENCE', name: 'Bachelor / Licence' },
        { code: 'MASTER', name: 'Master / Mastère' },
        { code: 'DOCTORATE', name: 'Doctorate / Doctorat' }
      ]
    };

    const categorySelect = document.getElementById('educationCategory');
    const levelGroup = document.getElementById('levelGroup');
    const levelSelect = document.getElementById('educationLevel');
    const gradeGroup = document.getElementById('gradeGroup');
    const gradeSelect = document.getElementById('gradeSelect');
    const specializationGroup = document.getElementById('specializationGroup');
    const specializationSelect = document.getElementById('specializationSelect');
    const fieldGroup = document.getElementById('fieldGroup');
    const fieldSelect = document.getElementById('fieldSelect');
    const booksSection = document.getElementById('booksSection');
    const booksGrid = document.getElementById('booksGrid');
    const sectionTitle = document.getElementById('sectionTitle');
    const booksCount = document.getElementById('booksCount');
    const debugInfo = document.getElementById('debugInfo');

    let currentLevelData = null;
    let allBooks = [];

    categorySelect.addEventListener('change', function() {
      const category = this.value;
      levelSelect.innerHTML = '<option value="">-- Select Level --</option>';
      gradeGroup.style.display = 'none';
      specializationGroup.style.display = 'none';
      fieldGroup.style.display = 'none';
      booksSection.style.display = 'none';
      
      if (category) {
        levelGroup.style.display = 'block';
        const levels = educationLevels[category];
        levels.forEach(level => {
          const option = document.createElement('option');
          option.value = level.code;
          option.textContent = level.name;
          levelSelect.appendChild(option);
        });
      } else {
        levelGroup.style.display = 'none';
      }
    });

    levelSelect.addEventListener('change', async function() {
      const levelCode = this.value;
      gradeGroup.style.display = 'none';
      specializationGroup.style.display = 'none';
      fieldGroup.style.display = 'none';
      
      if (levelCode) {
        await loadEducationLevelData(levelCode);
      } else {
        booksSection.style.display = 'none';
      }
    });

    gradeSelect.addEventListener('change', function() {
      filterAndDisplayBooks();
    });

    specializationSelect.addEventListener('change', function() {
      filterAndDisplayBooks();
    });

    fieldSelect.addEventListener('change', function() {
      filterAndDisplayBooks();
    });

    async function loadEducationLevelData(levelCode) {
      try {
        console.log('Loading education level data for:', levelCode);
        
        const url = `/api/elibrary/education-levels/${levelCode}`;
        console.log('Fetching from URL:', url);
        
        const response = await fetch(url);
        console.log('Response status:', response.status);
        console.log('Response headers:', response.headers);
        
        if (!response.ok) {
          const errorText = await response.text();
          console.error('Error response:', errorText);
          throw new Error(`Failed to load education level data: ${response.status} - ${errorText}`);
        }
        
        const responseText = await response.text();
        console.log('Raw response:', responseText);
        
        currentLevelData = JSON.parse(responseText);
        console.log('Parsed education level data:', currentLevelData);
        console.log('Specializations in response:', currentLevelData.specializations);
        
        allBooks = currentLevelData.books || [];
        console.log('Total books:', allBooks.length);
        
        gradeSelect.innerHTML = '<option value="">-- All Grades --</option>';
        specializationSelect.innerHTML = '<option value="">-- All Specializations --</option>';
        fieldSelect.innerHTML = '<option value="">-- All Fields --</option>';
        
        gradeGroup.style.display = 'none';
        specializationGroup.style.display = 'none';
        fieldGroup.style.display = 'none';
        
        if (currentLevelData.grades && currentLevelData.grades.length > 0) {
          console.log('Found grades:', currentLevelData.grades.length);
          gradeGroup.style.display = 'block';
          currentLevelData.grades.forEach(grade => {
            const option = document.createElement('option');
            option.value = grade.number;
            option.textContent = grade.value;
            gradeSelect.appendChild(option);
          });
        }
        
        if (currentLevelData.specializations && currentLevelData.specializations.length > 0) {
          console.log('Found specializations:', currentLevelData.specializations.length);
          console.log('Specializations:', currentLevelData.specializations);
          specializationGroup.style.display = 'block';
          currentLevelData.specializations.forEach(spec => {
            const option = document.createElement('option');
            option.value = spec.code;
            option.textContent = spec.value;
            specializationSelect.appendChild(option);
            console.log('Added specialization:', spec.code, spec.value);
          });
        }
        
        if (currentLevelData.fields && currentLevelData.fields.length > 0) {
          console.log('Found fields:', currentLevelData.fields.length);
          fieldGroup.style.display = 'block';
          currentLevelData.fields.forEach(field => {
            const option = document.createElement('option');
            option.value = field.code;
            option.textContent = field.value;
            fieldSelect.appendChild(option);
          });
        }
        
        debugInfo.style.display = 'block';
        debugInfo.innerHTML = `
          <strong>Debug Info:</strong><br>
          Level Code: ${levelCode}<br>
          Grades: ${currentLevelData.grades ? currentLevelData.grades.length : 0}<br>
          Specializations: ${currentLevelData.specializations ? currentLevelData.specializations.length : 0}<br>
          Fields: ${currentLevelData.fields ? currentLevelData.fields.length : 0}<br>
          Books: ${allBooks.length}
        `;
        
        filterAndDisplayBooks();
        
      } catch (error) {
        console.error('Error loading education level data:', error);
        booksGrid.innerHTML = `<div class="no-books">Error loading data: ${error.message}<br><br>Please check the browser console (F12) for details.</div>`;
      }
    }

    function filterAndDisplayBooks() {
      booksSection.style.display = 'block';
      
      const selectedGrade = gradeSelect.value;
      const selectedSpecialization = specializationSelect.value;
      const selectedField = fieldSelect.value;
      
      console.log('Filtering with:', { selectedGrade, selectedSpecialization, selectedField });
      
      let filteredBooks = allBooks;
      
      if (selectedGrade) {
        filteredBooks = filteredBooks.filter(book => 
          book.grade && book.grade.toString() === selectedGrade
        );
        console.log('After grade filter:', filteredBooks.length);
      }
      
      if (selectedSpecialization) {
        filteredBooks = filteredBooks.filter(book => {
          console.log('Book specialization:', book.specialization, 'Selected:', selectedSpecialization);
          return book.specialization === selectedSpecialization;
        });
        console.log('After specialization filter:', filteredBooks.length);
      }
      
      if (selectedField) {
        filteredBooks = filteredBooks.filter(book => book.field === selectedField);
        console.log('After field filter:', filteredBooks.length);
      }
      
      const levelName = levelSelect.options[levelSelect.selectedIndex].text;
      let titleParts = [levelName];
      
      if (selectedGrade && gradeGroup.style.display !== 'none') {
        const gradeName = gradeSelect.options[gradeSelect.selectedIndex].text;
        titleParts.push(gradeName);
      }
      
      if (selectedSpecialization) {
        const specName = specializationSelect.options[specializationSelect.selectedIndex].text;
        titleParts.push(specName);
      }
      
      if (selectedField) {
        const fieldName = fieldSelect.options[fieldSelect.selectedIndex].text;
        titleParts.push(fieldName);
      }
      
      sectionTitle.textContent = `Books for ${titleParts.join(' - ')}`;
      booksCount.textContent = `${filteredBooks.length} book${filteredBooks.length !== 1 ? 's' : ''} found`;
      
      if (filteredBooks.length === 0) {
        booksGrid.innerHTML = '<div class="no-books">No books available for the selected criteria.</div>';
        return;
      }
      
      booksGrid.innerHTML = '';
      filteredBooks.forEach((book, index) => {
        const bookCard = createBookCard(book, index);
        booksGrid.appendChild(bookCard);
      });
    }

    function createBookCard(book, index) {
      const card = document.createElement('div');
      card.className = 'book-card';
      card.style.animationDelay = `${index * 0.1}s`;
      
      const title = document.createElement('div');
      title.className = 'book-title';
      title.textContent = book.title;
      
      const meta = document.createElement('div');
      meta.className = 'book-meta';
      
      const metaItems = [
        { label: 'Author', value: book.author },
        { label: 'Subject', value: book.subject },
        { label: 'ISBN', value: book.isbn },
        { label: 'Year', value: book.publicationYear }
      ];
      
      metaItems.forEach(item => {
        if (item.value) {
          const metaItem = document.createElement('div');
          metaItem.className = 'book-meta-item';
          metaItem.innerHTML = `<strong>${item.label}:</strong> <span>${item.value}</span>`;
          meta.appendChild(metaItem);
        }
      });
      
      const tags = document.createElement('div');
      tags.className = 'book-tags';
      
      const tagData = [
        book.language,
        book.format,
        book.field,
        book.specialization,
        book.type
      ].filter(Boolean);
      
      tagData.forEach(tagText => {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = tagText;
        tags.appendChild(tag);
      });
      
      const actions = document.createElement('div');
      actions.className = 'book-actions';
      
      const downloadBtn = document.createElement('button');
      downloadBtn.className = 'btn-download';
      downloadBtn.innerHTML = '📥 Open/Download Book';
      downloadBtn.onclick = () => openBook(book);
      actions.appendChild(downloadBtn);
      
      card.appendChild(title);
      card.appendChild(meta);
      if (tagData.length > 0) {
        card.appendChild(tags);
      }
      card.appendChild(actions);
      
      return card;
    }

    function openBook(book) {
      const pdfPath = `/books/${book.id}.pdf`;
      
      const link = document.createElement('a');
      link.href = pdfPath;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      
      fetch(pdfPath, { method: 'HEAD' })
        .then(response => {
          if (response.ok) {
            link.click();
          } else {
            alert(`PDF file not found for "${book.title}".\n\nPlease place the PDF file at:\n${pdfPath}\n\nFile should be named: ${book.id}.pdf`);
          }
        })
        .catch(() => {
          alert(`PDF file not found for "${book.title}".\n\nPlease place the PDF file at:\nsrc/main/webapp/books/${book.id}.pdf`);
        });
    }
  </script>
</body>
</html>
